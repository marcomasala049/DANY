<!DOCTYPE html>
<html><body style="margin:0">
<iframe id="f" src="http://127.0.0.1:8123/apps/procedure-builder/index.html" style="width:1400px;height:900px;border:0"></iframe>
<script>
document.getElementById('f').addEventListener('load', () => {
  setTimeout(() => {
    const w = document.getElementById('f').contentWindow;
    const d = w.document;
    const desc = d.querySelector('.b-desc');
    desc.focus();
    // Type some text, select it, bold it, then add more italic + underline + table.
    d.execCommand('insertText', false, 'Attenzione: ');
    d.execCommand('bold');
    d.execCommand('insertText', false, 'alta tensione');
    d.execCommand('bold');
    d.execCommand('insertText', false, ' verifica ');
    d.execCommand('italic');
    d.execCommand('insertText', false, 'con attenzione');
    d.execCommand('italic');
    d.execCommand('insertText', false, ' e ');
    d.execCommand('underline');
    d.execCommand('insertText', false, 'sottolineato');
    d.execCommand('underline');
    d.execCommand('insertHTML', false, '<table><tr><td>Fase</td><td>Valore</td></tr><tr><td>1</td><td>120V</td></tr></table>');
    setTimeout(() => {
      document.title = 'DONE:' + desc.innerHTML;
    }, 200);
  }, 500);
});
</script>
</body></html>
