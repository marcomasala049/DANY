<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 650" role="img" aria-labelledby="title desc">
<title id="title">DANI Robotic Hands</title>
<desc id="desc">Two precision robotic forearms and articulated hands reach toward one another, with a small gap between their index fingertips.</desc>
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".48" stop-color="#e8ebee"/>
    <stop offset="1" stop-color="#bcc2c8"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6d747b"/>
    <stop offset=".45" stop-color="#252b31"/>
    <stop offset="1" stop-color="#0f1317"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9ced2"/>
    <stop offset=".5" stop-color="#f8f9fa"/>
    <stop offset="1" stop-color="#858d94"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
    <feOffset dy="6"/>
    <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .outline{stroke:#1e252b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .fine{fill:none;stroke:#5d666e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .shell{fill:url(#shell)}
    .dark{fill:url(#metal)}
    .steel{fill:url(#steel)}
    .joint{fill:#20262c;stroke:#8c949b;stroke-width:4}
    .hub{fill:#dfe3e6;stroke:#333a40;stroke-width:5}
    .accent{fill:#c8102e;stroke:#8e0b20;stroke-width:3}
  </style>
</defs>

<!-- LEFT ROBOTIC ARM -->
<g id="left-arm" filter="url(#softShadow)">
  <path class="shell outline" d="M-55 342 C70 280 168 252 282 250 L424 263 C470 267 500 300 494 337 C488 374 451 397 407 393 L267 382 C151 389 65 414-55 462 Z"/>
  <path class="dark outline" d="M171 285 L285 274 L398 287 L390 360 L273 353 L169 377 Z"/>
  <path class="shell outline" d="M239 251 L302 225 L435 240 L473 278 L452 321 L312 312 L250 337 Z"/>
  <path class="fine" d="M284 269 L310 247 M322 272 L350 247 M365 277 L391 252"/>
  <circle class="hub" cx="451" cy="318" r="58"/>
  <circle class="joint" cx="451" cy="318" r="35"/>
  <circle class="steel outline" cx="451" cy="318" r="15"/>
  <path class="accent" d="M420 271 A58 58 0 0 1 474 263 L465 281 A38 38 0 0 0 431 286 Z"/>

  <!-- forearm -->
  <path class="shell outline" d="M480 288 C560 271 632 276 699 306 L733 335 L711 381 L668 393 C601 371 546 359 477 358 Z"/>
  <path class="dark outline" d="M515 303 L648 303 L690 321 L676 365 L537 348 Z"/>
  <path class="steel outline" d="M527 278 L648 281 L681 298 L666 318 L540 312 Z"/>
  <circle class="hub" cx="708" cy="355" r="45"/>
  <circle class="joint" cx="708" cy="355" r="25"/>
</g>

<!-- LEFT HAND -->
<g id="left-hand" filter="url(#softShadow)">
  <path class="shell outline" d="M721 320 C754 290 793 275 830 281 C859 286 877 306 873 329 C869 352 846 362 821 357 L791 350 C814 368 819 391 804 407 C787 424 759 413 744 392 L710 363 Z"/>
