  <path class="shell outline" d="M797 359 C827 374 847 389 860 408 L842 425 C823 405 806 393 779 383 Z"/>
  <path class="shell outline" d="M773 374 C795 393 808 410 814 430 L792 440 C781 419 768 405 747 391 Z"/>
  <path class="fine" d="M747 314 L766 335 M757 300 L782 323"/>
</g>

<!-- RIGHT ROBOTIC ARM -->
<g id="right-arm" filter="url(#softShadow)" transform="translate(1800 0) scale(-1 1)">
  <path class="shell outline" d="M-55 342 C70 280 168 252 282 250 L424 263 C470 267 500 300 494 337 C488 374 451 397 407 393 L267 382 C151 389 65 414-55 462 Z"/>
  <path class="dark outline" d="M171 285 L285 274 L398 287 L390 360 L273 353 L169 377 Z"/>
  <path class="shell outline" d="M239 251 L302 225 L435 240 L473 278 L452 321 L312 312 L250 337 Z"/>
  <path class="fine" d="M284 269 L310 247 M322 272 L350 247 M365 277 L391 252"/>
  <circle class="hub" cx="451" cy="318" r="58"/>
  <circle class="joint" cx="451" cy="318" r="35"/>
  <circle class="steel outline" cx="451" cy="318" r="15"/>
  <path class="accent" d="M420 271 A58 58 0 0 1 474 263 L465 281 A38 38 0 0 0 431 286 Z"/>
  <path class="shell outline" d="M480 288 C560 271 632 276 699 306 L733 335 L711 381 L668 393 C601 371 546 359 477 358 Z"/>
  <path class="dark outline" d="M515 303 L648 303 L690 321 L676 365 L537 348 Z"/>
  <path class="steel outline" d="M527 278 L648 281 L681 298 L666 318 L540 312 Z"/>
  <circle class="hub" cx="708" cy="355" r="45"/>
  <circle class="joint" cx="708" cy="355" r="25"/>
</g>

<!-- RIGHT HAND, intentionally different articulation -->
<g id="right-hand" filter="url(#softShadow)">
  <path class="shell outline" d="M1079 320 C1046 290 1007 275 970 281 C941 286 923 306 927 329 C931 352 954 362 979 357 L1009 350 C986 368 981 391 996 407 C1013 424 1041 413 1056 392 L1090 363 Z"/>
