  <path class="shell outline" d="M1003 359 C973 374 953 389 940 408 L958 425 C977 405 994 393 1021 383 Z"/>
  <path class="shell outline" d="M1027 374 C1005 393 992 410 986 430 L1008 440 C1019 419 1032 405 1053 391 Z"/>
  <path class="fine" d="M1053 314 L1034 335 M1043 300 L1018 323"/>
</g>

<!-- central symbolic gap / alignment marks -->
<g id="central-detail" opacity=".65">
  <circle cx="900" cy="272" r="3.5" fill="#c8102e"/>
  <path d="M900 242 V252 M900 292 V302 M870 272 H880 M920 272 H930" stroke="#c8102e" stroke-width="2" stroke-linecap="round" opacity=".35"/>
</g>

<!-- subtle construction lines -->
<g opacity=".22" fill="none" stroke="#69727a" stroke-width="2" stroke-dasharray="5 10">
  <path d="M80 505 C370 465 570 458 735 476"/>
  <path d="M1720 505 C1430 465 1230 458 1065 476"/>
</g>
</svg>