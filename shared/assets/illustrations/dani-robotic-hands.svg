  <!-- left index -->
  <g id="left-index">
    <path class="shell outline" d="M823 294 C855 276 888 262 920 254 L930 281 C901 292 872 307 845 326 Z"/>
    <circle class="joint" cx="929" cy="267" r="16"/>
    <path class="shell outline" d="M942 256 C974 248 1005 246 1036 251 L1033 277 C1005 275 979 278 951 284 Z"/>
